<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple 2D Map</title>

  <!-- Leaflet CSS via CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Fill the whole screen with the map */
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Leaflet JS via CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialize the map (Coordinates: [Latitude, Longitude], Zoom Level)
    const map = L.map('map').setView([51.505, -0.09], 13);

    // 2. Load open-source map tiles from OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 3. (Optional) Add a marker with a popup
    L.marker([51.505, -0.09])
      .addTo(map)
      .bindPopup('Hello! This is a simple interactive map.')
      .openPopup();
  </script>

</body>
</html>
