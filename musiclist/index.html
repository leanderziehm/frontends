<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Ranking Manager</title>

    <style>
        /*
         * Structure/layout only.
         * No decorative colors, shadows, custom fonts, etc.
         */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            display: block;
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            margin-bottom: 24px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        input,
        select,
        textarea,
        button {
            font: inherit;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-list {
            display: grid;
            gap: 8px;
        }

        .category-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
            align-items: center;
        }

        .items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            border: 1px solid currentColor;
            padding: 12px;
            cursor: grab;
        }

        .item.dragging {
            opacity: 0.5;
        }

        .item-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
        }

        .item-rank {
            min-width: 40px;
        }

        .item-details {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }

        .item-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-url {
            overflow-wrap: anywhere;
        }

        .empty-message {
            padding: 12px 0;
        }

        dialog {
            max-width: 500px;
            width: calc(100% - 40px);
        }

        @media (max-width: 700px) {
            .form-row,
            .item-header {
                grid-template-columns: 1fr;
            }

            .category-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<main>

    <header>
        <h1>YouTube Ranking Manager</h1>
        <p>
            Add YouTube links, rate them, categorize them, add notes, and manually
            arrange their order.
        </p>
    </header>

    <!-- =========================
         ADD / EDIT ITEM
    ========================== -->
    <section>
        <h2 id="form-title">Add Item</h2>

        <form id="item-form">

            <div class="form-group">
                <label for="youtube-url">YouTube link</label>
                <input
                    id="youtube-url"
                    name="youtube-url"
                    type="url"
                    placeholder="https://www.youtube.com/watch?v=..."
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="rating">Rating (5–10)</label>
                    <input
                        id="rating"
                        name="rating"
                        type="number"
                        min="5"
                        max="10"
                        step="0.1"
                        value="5"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">No category</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Your notes about this video..."
                ></textarea>
            </div>

            <div class="button-row">
                <button type="submit" id="save-item-button">
                    Add Item
                </button>

                <button
                    type="button"
                    id="cancel-edit-button"
                    hidden
                >
                    Cancel Edit
                </button>
            </div>

        </form>
    </section>


    <!-- =========================
         CATEGORIES
    ========================== -->
    <section>
        <h2>Categories</h2>

        <div class="button-row">
            <button type="button" id="add-category-button">
                + Add Category
            </button>
        </div>

        <br>

        <div id="category-list" class="category-list"></div>
    </section>


    <!-- =========================
         DATA MANAGEMENT
    ========================== -->
    <section>
        <h2>Data</h2>

        <div class="button-row">
            <button type="button" id="export-button">
                Export JSON
            </button>

            <button type="button" id="import-button">
                Import JSON
            </button>

            <button type="button" id="clear-data-button">
                Clear All Data
            </button>
        </div>

        <input
            type="file"
            id="import-file"
            accept=".json,application/json"
            hidden
        >
    </section>


    <!-- =========================
         ITEMS
    ========================== -->
    <section>
        <h2>Ranked Items</h2>

        <p>
            Drag and drop items to manually change their order.
            The order is automatically saved.
        </p>

        <div id="items" class="items"></div>

        <p id="empty-message" class="empty-message">
            No items yet.
        </p>
    </section>

</main>


<script>
"use strict";

/*
 * ============================================================
 * DATA MODEL
 * ============================================================
 *
 * {
 *   version: 1,
 *   categories: [
 *      {
 *          id: "...",
 *          name: "..."
 *      }
 *   ],
 *   items: [
 *      {
 *          id: "...",
 *          youtubeUrl: "...",
 *          rating: 8.5,
 *          notes: "...",
 *          categoryId: "...",
 *          order: 0,
 *          createdAt: "...",
 *          updatedAt: "..."
 *      }
 *   ]
 * }
 *
 * "order" is explicitly stored so the manual order survives
 * JSON export/import.
 */

const STORAGE_KEY = "youtube-ranking-manager";

let state = {
    version: 1,
    categories: [],
    items: []
};

let editingItemId = null;
let draggedItemId = null;


/*
 * ============================================================
 * DOM REFERENCES
 * ============================================================
 */

const itemForm = document.getElementById("item-form");
const formTitle = document.getElementById("form-title");

const youtubeUrlInput = document.getElementById("youtube-url");
const ratingInput = document.getElementById("rating");
const categorySelect = document.getElementById("category");
const notesInput = document.getElementById("notes");

const saveItemButton = document.getElementById("save-item-button");
const cancelEditButton = document.getElementById("cancel-edit-button");

const categoryList = document.getElementById("category-list");
const addCategoryButton = document.getElementById("add-category-button");

const itemsContainer = document.getElementById("items");
const emptyMessage = document.getElementById("empty-message");

const exportButton = document.getElementById("export-button");
const importButton = document.getElementById("import-button");
const importFileInput = document.getElementById("import-file");
const clearDataButton = document.getElementById("clear-data-button");


/*
 * ============================================================
 * UTILITY FUNCTIONS
 * ============================================================
 */

function generateId() {
    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random().toString(36).substring(2)
    );
}


function nowISO() {
    return new Date().toISOString();
}


function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}


function normalizeRating(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) {
        return 5;
    }

    return Math.min(10, Math.max(5, number));
}


/*
 * ============================================================
 * LOCAL STORAGE
 * ============================================================
 */

function saveState() {
    normalizeState();

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}


function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
        return;
    }

    try {
        const parsed = JSON.parse(raw);

        state = parsed;

        normalizeState();
    } catch (error) {
        console.error("Could not load saved data:", error);

        alert(
            "The saved local data could not be read. " +
            "The application will start with empty data."
        );

        state = {
            version: 1,
            categories: [],
            items: []
        };
    }
}


/*
 * Make imported/old data safe and consistent.
 */

function normalizeState() {
    if (!state || typeof state !== "object") {
        state = {};
    }

    if (!Array.isArray(state.categories)) {
        state.categories = [];
    }

    if (!Array.isArray(state.items)) {
        state.items = [];
    }

    state.version = 1;

    state.categories = state.categories
        .filter(category => category && typeof category === "object")
        .map(category => ({
            id: String(category.id || generateId()),
            name: String(category.name || "Unnamed Category").trim()
        }))
        .filter(category => category.name.length > 0);

    state.items = state.items
        .filter(item => item && typeof item === "object")
        .map(item => ({
            id: String(item.id || generateId()),
            youtubeUrl: String(item.youtubeUrl || item.url || "").trim(),
            rating: normalizeRating(item.rating),
            notes: String(item.notes || ""),
            categoryId: item.categoryId
                ? String(item.categoryId)
                : "",
            order: Number.isFinite(Number(item.order))
                ? Number(item.order)
                : 0,
            createdAt: item.createdAt || nowISO(),
            updatedAt: item.updatedAt || nowISO()
        }));

    /*
     * Remove category references that no longer exist.
     */
    const categoryIds = new Set(
        state.categories.map(category => category.id)
    );

    state.items.forEach(item => {
        if (
            item.categoryId &&
            !categoryIds.has(item.categoryId)
        ) {
            item.categoryId = "";
        }
    });

    /*
     * Make sure order values are sequential.
     */
    sortItemsByManualOrder();

    state.items.forEach((item, index) => {
        item.order = index;
    });
}


/*
 * ============================================================
 * MANUAL SORTING
 * ============================================================
 */

function sortItemsByManualOrder() {
    state.items.sort((a, b) => {
        return Number(a.order) - Number(b.order);
    });
}


function updateOrderFromCurrentArray() {
    state.items.forEach((item, index) => {
        item.order = index;
    });

    saveState();
}


/*
 * ============================================================
 * CATEGORY FUNCTIONS
 * ============================================================
 */

function getCategoryName(categoryId) {
    if (!categoryId) {
        return "";
    }

    const category = state.categories.find(
        category => category.id === categoryId
    );

    return category ? category.name : "";
}


function renderCategorySelect() {
    const currentValue = categorySelect.value;

    categorySelect.innerHTML = "";

    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "No category";
    categorySelect.appendChild(emptyOption);

    state.categories.forEach(category => {
        const option = document.createElement("option");

        option.value = category.id;
        option.textContent = category.name;

        categorySelect.appendChild(option);
    });

    if (
        state.categories.some(
            category => category.id === currentValue
        )
    ) {
        categorySelect.value = currentValue;
    } else {
        categorySelect.value = "";
    }
}


function renderCategories() {
    categoryList.innerHTML = "";

    if (state.categories.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No categories created.";
        categoryList.appendChild(message);
        return;
    }

    state.categories.forEach(category => {
        const row = document.createElement("div");
        row.className = "category-row";

        const name = document.createElement("span");
        name.textContent = category.name;

        const renameButton = document.createElement("button");
        renameButton.type = "button";
        renameButton.textContent = "Rename";

        renameButton.addEventListener("click", () => {
            renameCategory(category.id);
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () => {
            deleteCategory(category.id);
        });

        row.appendChild(name);
        row.appendChild(renameButton);
        row.appendChild(deleteButton);

        categoryList.appendChild(row);
    });
}


function addCategory() {
    const name = prompt("Enter the new category name:");

    if (name === null) {
        return;
    }

    const trimmedName = name.trim();

    if (!trimmedName) {
        alert("Category name cannot be empty.");
        return;
    }

    const duplicate = state.categories.some(
        category =>
            category.name.toLowerCase() ===
            trimmedName.toLowerCase()
    );

    if (duplicate) {
        alert("A category with that name already exists.");
        return;
    }

    const category = {
        id: generateId(),
        name: trimmedName
    };

    state.categories.push(category);

    saveState();

    renderCategories();
    renderCategorySelect();
}


function renameCategory(categoryId) {
    const category = state.categories.find(
        category => category.id === categoryId
    );

    if (!category) {
        return;
    }

    const newName = prompt(
        "Enter the new category name:",
        category.name
    );

    if (newName === null) {
        return;
    }

    const trimmedName = newName.trim();

    if (!trimmedName) {
        alert("Category name cannot be empty.");
        return;
    }

    const duplicate = state.categories.some(
        other =>
            other.id !== categoryId &&
            other.name.toLowerCase() ===
            trimmedName.toLowerCase()
    );

    if (duplicate) {
        alert("A category with that name already exists.");
        return;
    }

    category.name = trimmedName;

    saveState();

    renderCategories();
    renderCategorySelect();
    renderItems();
}


function deleteCategory(categoryId) {
    const category = state.categories.find(
        category => category.id === categoryId
    );

    if (!category) {
        return;
    }

    const itemCount = state.items.filter(
        item => item.categoryId === categoryId
    ).length;

    let message =
        `Delete category "${category.name}"?`;

    if (itemCount > 0) {
        message +=
            `\n\n${itemCount} item(s) currently use this category. ` +
            "Those items will become uncategorized.";
    }

    if (!confirm(message)) {
        return;
    }

    state.categories = state.categories.filter(
        category => category.id !== categoryId
    );

    state.items.forEach(item => {
        if (item.categoryId === categoryId) {
            item.categoryId = "";
        }
    });

    saveState();

    renderCategories();
    renderCategorySelect();
    renderItems();
}


/*
 * ============================================================
 * ITEM FORM
 * ============================================================
 */

function resetItemForm() {
    editingItemId = null;

    itemForm.reset();

    ratingInput.value = "5";
    categorySelect.value = "";

    formTitle.textContent = "Add Item";
    saveItemButton.textContent = "Add Item";
    cancelEditButton.hidden = true;
}


function startEditingItem(itemId) {
    const item = state.items.find(
        item => item.id === itemId
    );

    if (!item) {
        return;
    }

    editingItemId = item.id;

    youtubeUrlInput.value = item.youtubeUrl;
    ratingInput.value = item.rating;
    notesInput.value = item.notes;
    categorySelect.value = item.categoryId || "";

    formTitle.textContent = "Edit Item";
    saveItemButton.textContent = "Save Changes";
    cancelEditButton.hidden = false;

    youtubeUrlInput.focus();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function isYouTubeUrl(url) {
    try {
        const parsed = new URL(url);

        const hostname = parsed.hostname
            .toLowerCase()
            .replace(/^www\./, "");

        return (
            hostname === "youtube.com" ||
            hostname === "m.youtube.com" ||
            hostname === "youtu.be" ||
            hostname === "youtube-nocookie.com"
        );
    } catch {
        return false;
    }
}


function handleItemSubmit(event) {
    event.preventDefault();

    const youtubeUrl = youtubeUrlInput.value.trim();
    const rating = Number(ratingInput.value);
    const notes = notesInput.value;
    const categoryId = categorySelect.value;

    if (!youtubeUrl) {
        alert("Please enter a YouTube URL.");
        return;
    }

    if (!isYouTubeUrl(youtubeUrl)) {
        alert("Please enter a valid YouTube URL.");
        return;
    }

    if (!Number.isFinite(rating) || rating < 5 || rating > 10) {
        alert("The rating must be between 5 and 10.");
        return;
    }

    if (editingItemId) {
        const item = state.items.find(
            item => item.id === editingItemId
        );

        if (!item) {
            resetItemForm();
            return;
        }

        item.youtubeUrl = youtubeUrl;
        item.rating = rating;
        item.notes = notes;
        item.categoryId = categoryId;
        item.updatedAt = nowISO();

    } else {
        const item = {
            id: generateId(),
            youtubeUrl: youtubeUrl,
            rating: rating,
            notes: notes,
            categoryId: categoryId,
            order: state.ite
