<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Typing Trainer</title>

<style>
  body {
    margin: 0;
    padding-top: 200px;
    font-family: Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #handOverlay {
    width: 420px;
    text-align: center;
    z-index: 10;
  }

  #handContainer {
    position: relative;
    width: 420px;
  }

  #handsBase {
    width: 420px;
    border-radius: 10px;
  }

  #fingerCutout {
    position: absolute;
    top: 0;
    left: 0;
    width: 420px;
    pointer-events: none;
    mix-blend-mode: multiply;
  }

  #app {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 80%;
    max-width: 900px;
  }

  #topControls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }

  button, select {
    padding:10px 18px;
    border:none;
    border-radius:6px;
    background:#3a82f6;
    color:white;
    cursor:pointer;
  }

  select{
    background:#1a1d24;
    border:1px solid #333;
  }

  #textDisplay {
    margin-top: 20px;
    font-size: 20px;
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.6;
  }

  .done {
    color: #666;
  }

  .current {
    background: #3a82f6;
    border-radius: 4px;
    padding: 2px 4px;
  }

  a{
    color:#8ab4ff;
  }
</style>
<script src="./color-utils.js"></script>
</head>

<body>

<div id="textDisplay"></div>
<div id="handOverlay">
  <div id="handContainer">
    <img id="handsBase" src="./images/hands.png"/>
    <img id="fingerCutout" src=""/>
  </div>

</div>

<div id="app">

  <div id="topControls">
    <select id="savedTexts"></select>

    <button onclick="loadSelectedText()">
      Load Selected
    </button>

    <button onclick="loadRandomText()">
      Random
    </button>

    <a href="./manage.html">Manage Texts</a>
  </div>

</div>

<script>
const STORAGE_KEY = "typingTrainerTexts";

let text = "";
let index = 0;
let spans = [];

const fingerMap = {
  left_pinky: { hex:"#e93545", image:"./images/left-pinky.png", keys:["q","a","1"] },
  left_ring_finger: { hex:"#f1a524", image:"./images/left-ring.png", keys:["w","s","2"] },
  left_middle_finger: { hex:"#72bf7c", image:"./images/left-middle.png", keys:["e","d","3"] },
  left_index_finger: { hex:"#07aee8", image:"./images/left-index.png", keys:["r","t","f","g","4","5"] },
  right_index_finger: { hex:"#197295", image:"./images/right-index.png", keys:["y","u","h","j","6","7"] },
  right_middle_finger: { hex:"#98d6f3", image:"./images/right-middle.png", keys:["i","k","8"] },
  right_ring_finger: { hex:"#fbe9a4", image:"./images/right-ring.png", keys:["o","l","9"] },
  right_pinky: { hex:"#a4aaa2", image:"./images/right-pinky.png", keys:["p",";","0"] },
  thumbs: { hex:"#ffffff", image:"./images/left-thumb.png", keys:[" "] }
};

function getEntries() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
}

function populateDropdown() {
  const select = document.getElementById("savedTexts");
  select.innerHTML = "";

  const entries = getEntries();

  entries.forEach((entry, i) => {
    const option = document.createElement("option");

    option.value = entry.id;
    option.textContent =
      `Text ${i + 1} — ${entry.text.substring(0, 50).replace(/\n/g, " ")}`;

    select.appendChild(option);
  });
}

function loadSelectedText() {
  const id = document.getElementById("savedTexts").value;

  const entry = getEntries().find(e => e.id === id);

  if (!entry) return;

  start(entry.text);
}

function loadRandomText() {
  const entries = getEntries();

  if (entries.length === 0) {
    alert("No saved texts.");
    return;
  }

  const random =
    entries[Math.floor(Math.random() * entries.length)];

  start(random.text);
}

function start(newText) {
  text = newText;
  index = 0;

  const display = document.getElementById("textDisplay");
  display.innerHTML = "";

  spans = [];

  for (let i = 0; i < text.length; i++) {
    const s = document.createElement("span");

    s.textContent = text[i];

    display.appendChild(s);

    spans.push(s);
  }

  updateUI();
}

document.addEventListener("keydown", (e) => {
  if (!text) return;

  if (index >= text.length) return;

  index++;

  updateUI();
});

function updateUI() {
  spans.forEach((s, i) => {
    s.className =
      i < index
        ? "done"
        : (i === index ? "current" : "");
  });

  const currentChar = text[index] || " ";

  const finger = getFinger(currentChar);

  const cutout = document.getElementById("fingerCutout");

  if (!finger) return;


  cutout.src = finger.image;

  const { colorizeWhiteImage } = window.colorUtils;

  cutout.style.filter = colorizeWhiteImage(finger.hex);
}

function getFinger(char) {
  char = char.toLowerCase();

  for (const f of Object.values(fingerMap)) {
    if (f.keys.includes(char)) return f;
  }

  return fingerMap.thumbs;
}

populateDropdown();

if (getEntries().length > 0) {
  loadRandomText();
}
</script>

</body>
</html>
