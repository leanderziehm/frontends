<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Index</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e1b4b;
    --surface: rgba(255, 255, 255, 0.06);
    --surface-hover: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.1);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --radius: 16px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    color: var(--text-primary);
    background:
      radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.2), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    padding: 48px 20px 80px;
  }

  .page-wrap {
    width: 100%;
    max-width: 64vw;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 15px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 24px;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .toolbar-label {
    font-size: 12px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }

  .seg {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .seg button {
    all: unset;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: 7px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .seg button.active {
    background: #6366f1;
    color: #fff;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
  }

  .switch {
    position: relative;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.15);
    transition: background 0.15s ease;
    flex-shrink: 0;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s ease;
  }

  .toggle-row.on .switch {
    background: #6366f1;
  }

  .toggle-row.on .switch::after {
    transform: translateX(14px);
  }

  select.col-select {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  select.col-select:focus {
    outline: 1px solid #6366f1;
  }

  .items {
    display: grid;
    gap: 24px;
  }

  .items[data-cols="1"] { grid-template-columns: 1fr; }
  .items[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }
  .items[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }

  @media (max-width: 720px) {
    .items[data-cols="2"],
    .items[data-cols="3"] {
      grid-template-columns: 1fr;
    }
  }

  .card {
    --accent: #6366f1;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none;
    color: var(--text-primary);
    overflow: hidden;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }

  .card:hover {
    background: var(--surface-hover);
    border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    transform: translateY(-2px);
  }

  .card-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #0b1020;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }

  .card-preview iframe {
    width: 400%;
    height: 400%;
    transform: scale(0.25);
    transform-origin: top left;
    border: none;
    pointer-events: none;
    background: #fff;
  }

  .card-preview .preview-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--bg-1);
    background: var(--accent);
  }

  .card-preview .open-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(4px);
    color: #fff;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .card:hover .open-badge {
    opacity: 1;
  }

  .card-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
  }

  .card-info::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .card-body {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }

  .card-title {
    font-weight: 600;
    font-size: 15px;
  }

  .card-path {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: "SFMono-Regular", Consolas, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-arrow {
    flex-shrink: 0;
    color: var(--text-secondary);
    font-size: 18px;
    transition: transform 0.18s ease, color 0.18s ease;
  }

  .card:hover .card-arrow {
    transform: translateX(4px);
    color: var(--text-primary);
  }

  .items.list-mode {
    grid-template-columns: 1fr !important;
  }

  .items.list-mode .card {
    flex-direction: row;
    align-items: center;
  }

  .items.list-mode .card-preview {
    width: 120px;
    aspect-ratio: auto;
    height: 76px;
    flex-shrink: 0;
    border-bottom: none;
    border-right: 1px solid var(--border);
  }

  .items.list-mode .card-info {
    flex: 1;
  }

  .items.list-mode .card-info::before {
    display: none;
  }

  .items.no-preview .card-preview {
    display: none;
  }

  .empty {
    text-align: center;
    padding: 48px 24px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
  }

  .empty p {
    margin-bottom: 6px;
  }

  .empty-sub {
    font-size: 13px;
  }

  .empty code {
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, monospace;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
  <div class="page-wrap">
    <header>
      <span class="eyebrow">21 pages found</span>
      <h1>Project Index</h1>
      <p class="subtitle">Every page discovered under this directory, ready to open.</p>
    </header>

    <div class="toolbar">
      <div class="toolbar-group">
        <div class="seg" id="layout-seg">
          <button data-layout="grid" class="active">Grid</button>
          <button data-layout="list">List</button>
        </div>
      </div>

      <div class="toolbar-group">
        <select id="col-select" class="col-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3"selected>3</option>
        </select>
        <span class="toolbar-label">Columns</span>
      </div>

      <div class="toolbar-group">
        <label class="toggle-row on" id="preview-toggle">
          <span class="switch"></span>
          <span>Live previews</span>
        </label>
      </div>
    </div>

    <main class="items" id="items" data-cols="2"></main>

    <footer>Generated on August 16, 2026 at 15:31</footer>
  </div>

<script>
  const PAGES = [{"name": "Audio", "path": "audio", "url": "audio/", "accent": "#6366f1"}, {"name": "Countdown", "path": "countdown", "url": "countdown/", "accent": "#8b5cf6"}, {"name": "Exam Ml Wlan", "path": "exam-ml-wlan", "url": "exam-ml-wlan/", "accent": "#ec4899"}, {"name": "Exam Mlwl", "path": "exam-mlwl", "url": "exam-mlwl/", "accent": "#f59e0b"}, {"name": "Extract Colors", "path": "extract-colors", "url": "extract-colors/", "accent": "#10b981"}, {"name": "Habits", "path": "habits", "url": "habits/", "accent": "#06b6d4"}, {"name": "Json Schema", "path": "json-schema", "url": "json-schema/", "accent": "#ef4444"}, {"name": "Keyboard Shortcuts", "path": "keyboard-shortcuts", "url": "keyboard-shortcuts/", "accent": "#6366f1"}, {"name": "Lifetimes", "path": "lifetimes", "url": "lifetimes/", "accent": "#8b5cf6"}, {"name": "Math", "path": "math", "url": "math/", "accent": "#ec4899"}, {"name": "Math2", "path": "math2", "url": "math2/", "accent": "#f59e0b"}, {"name": "Math3", "path": "math3", "url": "math3/", "accent": "#10b981"}, {"name": "Measure", "path": "measure", "url": "measure/", "accent": "#06b6d4"}, {"name": "Mediawiki", "path": "mediawiki", "url": "mediawiki/", "accent": "#ef4444"}, {"name": "Mediawiki2", "path": "mediawiki2", "url": "mediawiki2/", "accent": "#6366f1"}, {"name": "Mediawiki3", "path": "mediawiki3", "url": "mediawiki3/", "accent": "#8b5cf6"}, {"name": "Notes", "path": "notes", "url": "notes/", "accent": "#ec4899"}, {"name": "Previewhtml", "path": "previewHTML", "url": "previewHTML/", "accent": "#f59e0b"}, {"name": "Prompting Helper", "path": "prompting-helper", "url": "prompting-helper/", "accent": "#10b981"}, {"name": "Ten Fingertyping", "path": "ten-fingertyping", "url": "ten-fingertyping/", "accent": "#06b6d4"}, {"name": "Typer", "path": "typer", "url": "typer/", "accent": "#ef4444"}];
  const itemsEl = document.getElementById("items");
  const colSelect = document.getElementById("col-select");
  const layoutSeg = document.getElementById("layout-seg");
  const previewToggle = document.getElementById("preview-toggle");

  const state = {
    layout: "grid",
    cols: 3,
    preview: true,
  };

  function render() {
    if (PAGES.length === 0) {
      itemsEl.innerHTML = `
        <div class="empty">
          <p>No pages found yet.</p>
          <p class="empty-sub">Add a folder containing an <code>index.html</code> and regenerate.</p>
        </div>`;
      return;
    }

    itemsEl.innerHTML = PAGES.map(p => `
      <a class="card" href="${p.url}" style="--accent:${p.accent}" target="_blank" rel="noopener">
        <span class="card-preview">
          <span class="preview-placeholder">${(p.name[0] || "?").toUpperCase()}</span>
          ${state.preview ? `<iframe src="${p.url}" loading="lazy" sandbox="allow-same-origin" title="${p.name} preview"></iframe>` : ""}
          <span class="open-badge">Open &rarr;</span>
        </span>
        <span class="card-info">
          <span class="card-body">
            <span class="card-title">${p.name}</span>
            <span class="card-path">/${p.url}</span>
          </span>
          <span class="card-arrow">&rarr;</span>
        </span>
      </a>
    `).join("");
  }

  function applyLayoutClasses() {
    itemsEl.classList.toggle("list-mode", state.layout === "list");
    itemsEl.classList.toggle("no-preview", !state.preview);
    itemsEl.dataset.cols = state.layout === "list" ? "1" : String(state.cols);
    colSelect.disabled = state.layout === "list";
    colSelect.style.opacity = state.layout === "list" ? 0.4 : 1;
  }

  layoutSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-layout]");
    if (!btn) return;
    state.layout = btn.dataset.layout;
    [...layoutSeg.querySelectorAll("button")].forEach(b =>
      b.classList.toggle("active", b === btn)
    );
    applyLayoutClasses();
  });

  colSelect.addEventListener("change", () => {
    state.cols = Number(colSelect.value);
    applyLayoutClasses();
  });

  previewToggle.addEventListener("click", () => {
    state.preview = !state.preview;
    previewToggle.classList.toggle("on", state.preview);
    render();
    applyLayoutClasses();
  });

  render();
  applyLayoutClasses();
</script>
</body>
</html>
