<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Groups</title><style>
    :root {
        --bg: #0f1117;
        --panel: #171a23;
        --panel-2: #1e222d;
        --border: #2b3140;
        --text: #f2f4f8;
        --muted: #9299aa;
        --accent: #6c8cff;
        --accent-2: #8c6cff;
        --success: #4dcc8a;
        --danger: #ff647c;
        --warning: #f2bb55;
        --shadow: 0 10px 35px rgba(0,0,0,.25);
        --radius: 14px;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
            Inter, ui-sans-serif, system-ui, -apple-system,
            BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px;
    }

    /* ---------- HEADER ---------- */

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
    }

    .brand h1 {
        margin: 0;
        font-size: 27px;
        letter-spacing: -.5px;
    }

    .brand p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 14px;
    }

    .top-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    /* ---------- BUTTONS ---------- */

    .btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 9px;
        padding: 9px 13px;
        transition: .15s ease;
    }

    .btn:hover {
        background: var(--panel-2);
        border-color: #3b4355;
        transform: translateY(-1px);
    }

    .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    .btn.primary:hover {
        filter: brightness(1.08);
    }

    .btn.success {
        background: rgba(77,204,138,.12);
        border-color: rgba(77,204,138,.35);
        color: #77e0a7;
    }

    .btn.danger {
        color: #ff8396;
    }

    .btn.small {
        padding: 6px 9px;
        font-size: 13px;
    }

    /* ---------- GLOBAL PROGRESS ---------- */

    .global-card {
        background: linear-gradient(
            135deg,
            rgba(108,140,255,.14),
            rgba(140,108,255,.08)
        );
        border: 1px solid rgba(108,140,255,.22);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 24px;
        box-shadow: var(--shadow);
    }

    .global-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 12px;
    }

    .global-title {
        font-weight: 700;
        font-size: 16px;
    }

    .global-stats {
        color: var(--muted);
        font-size: 14px;
    }

    .progress {
        height: 9px;
        background: #292e3b;
        border-radius: 99px;
        overflow: hidden;
    }

    .progress > div {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(
            90deg,
            var(--accent),
            var(--accent-2)
        );
        transition: width .3s ease;
    }

    .global-complete {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
    }

    /* ---------- GROUPS ---------- */

    .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    .section-heading h2 {
        margin: 0;
        font-size: 18px;
    }

    .groups-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 15px;
    }

    .group-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        min-height: 180px;
        box-shadow: var(--shadow);
        transition: .18s ease;
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .group-card:hover {
        transform: translateY(-2px);
        border-color: #3b4355;
    }

    .group-card.clickable {
        cursor: pointer;
    }

    .group-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
    }

    .group-name {
        font-size: 17px;
        font-weight: 700;
        word-break: break-word;
    }

    .group-menu {
        display: flex;
        gap: 3px;
    }

    .icon-btn {
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
    }

    .icon-btn:hover {
        background: var(--panel-2);
        border-color: var(--border);
        color: var(--text);
    }

    .group-description {
        color: var(--muted);
        font-size: 13px;
        margin: 8px 0 18px;
        min-height: 18px;
        word-break: break-word;
    }

    .group-footer {
        margin-top: auto;
    }

    .group-progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 7px;
    }

    .group-card .progress {
        height: 7px;
    }

    .group-count {
        margin-top: 9px;
        font-size: 12px;
        color: var(--muted);
    }

    .empty-state {
        padding: 55px 20px;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        color: var(--muted);
    }

    .empty-state strong {
        display: block;
        color: var(--text);
        margin-bottom: 6px;
    }

    /* ---------- GROUP VIEW ---------- */

    .hidden {
        display: none !important;
    }

    .group-view {
        animation: fadeIn .18s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(4px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .back-row {
        margin-bottom: 20px;
    }

    .group-view-header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 18px;
    }

    .group-view-title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 16px;
    }

    .group-view h2 {
        margin: 0;
        font-size: 25px;
        word-break: break-word;
    }

    .group-view-description {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 14px;
    }

    .work-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .work-actions .btn {
        min-width: 150px;
    }

    .view-progress {
        margin-top: 14px;
    }

    .view-progress-info {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 7px;
    }

    /* ---------- ITEM TOOLBAR ---------- */

    .items-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .items-toolbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .items-toolbar h3 {
        margin: 0;
        font-size: 17px;
    }

    .search {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 11px;
        width: 210px;
        outline: none;
    }

    .search:focus,
    input:focus,
    textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(108,140,255,.1);
    }

    /* ---------- ADD ITEM ---------- */

    .add-item {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
    }

    .add-item input {
        flex: 1;
    }

    .input,
    textarea {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        outline: none;
    }

    /* ---------- ITEMS ---------- */

    .items-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 12px 13px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: .15s ease;
    }

    .item.dragging {
        opacity: .45;
        border-style: dashed;
    }

    .item.drag-over {
        border-color: var(--accent);
        transform: translateY(-1px);
    }

    .drag-handle {
        color: #646c7c;
        cursor: grab;
        font-size: 18px;
        user-select: none;
    }

    .drag-handle:active {
        cursor: grabbing;
    }

    .check-btn {
        width: 25px;
        height: 25px;
        border-radius: 7px;
        border: 1px solid #495163;
        background: transparent;
        color: transparent;
        flex: 0 0 auto;
        font-weight: 900;
    }

    .check-btn:hover {
        border-color: var(--success);
    }

    .item.done .check-btn {
        background: var(--success);
        border-color: var(--success);
        color: #0c2117;
    }

    .item-content {
        min-width: 0;
        flex: 1;
    }

    .item-title {
        font-size: 14px;
        word-break: break-word;
    }

    .item.done .item-title {
        text-decoration: line-through;
        color: #777f90;
    }

    .item-meta {
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
    }

    .item-actions {
        display: flex;
        gap: 3px;
        opacity: .55;
    }

    .item:hover .item-actions {
        opacity: 1;
    }

    /* ---------- MODAL ---------- */

    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.62);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
    }

    .modal {
        width: min(500px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 20px 80px rgba(0,0,0,.5);
    }

    .modal h3 {
        margin: 0 0 18px;
    }

    .form-field {
        margin-bottom: 13px;
    }

    .form-field label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
    }

    /* ---------- TOAST ---------- */

    .toast-container {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .toast {
        background: #242936;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 14px;
        box-shadow: var(--shadow);
        font-size: 13px;
        animation: toastIn .2s ease;
    }

    @keyframes toastIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ---------- FOCUS ITEM ---------- */

    .item.focused {
        animation: focusPulse 1.2s ease;
        border-color: var(--accent);
    }

    @keyframes focusPulse {
        0% {
            box-shadow: 0 0 0 0 rgba(108,140,255,.45);
        }
        50% {
            box-shadow: 0 0 0 8px rgba(108,140,255,.1);
        }
        100% {
            box-shadow: 0 0 0 0 rgba(108,140,255,0);
        }
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width: 700px) {
        .app {
            padding: 17px;
        }

        .topbar,
        .group-view-title-row,
        .items-toolbar {
            flex-direction: column;
            align-items: stretch;
        }

        .top-actions {
            width: 100%;
        }

        .top-actions .btn {
            flex: 1;
        }

        .work-actions {
            flex-direction: column;
        }

        .work-actions .btn {
            width: 100%;
        }

        .search {
            width: 100%;
        }

        .add-item {
            flex-direction: column;
        }

        .global-top {
            align-items: flex-start;
            flex-direction: column;
            gap: 5px;
        }

        .item-actions {
            opacity: 1;
        }
    }
</style></head><body><div class="app"><!-- ================= HOME ================= -->

<div id="homeView">

    <header class="topbar">
        <div class="brand">
            <h1>Task Groups</h1>
            <p>Organize your work into focused groups.</p>
        </div>

        <div class="top-actions">
            <button class="btn" onclick="exportData()">Export</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">
                Import
            </button>
            <input
                id="importFile"
                type="file"
                accept=".json"
                style="display:none"
                onchange="importData(event)"
            >
            <button class="btn primary" onclick="openGroupModal()">
                + New Group
            </button>
        </div>
    </header>

    <section class="global-card">
        <div class="global-top">
            <div>
                <div class="global-title">Overall Progress</div>
                <div class="global-stats" id="globalStats">
                    0 of 0 items completed
                </div>
            </div>

            <strong id="globalPercent">0%</strong>
        </div>

        <div class="progress">
            <div id="globalProgress"></div>
        </div>

        <div class="global-complete" id="globalGroupStats">
            0 groups
        </div>
    </section>

    <div class="section-heading">
        <h2>Your Groups</h2>
    </div>

    <div id="groupsContainer" class="groups-grid"></div>

</div>


<!-- ================= GROUP ================= -->

<div id="groupView" class="group-view hidden">

    <div class="back-row">
        <button class="btn" onclick="showHome()">← All Groups</button>
    </div>

    <section class="group-view-header">

        <div class="group-view-title-row">

            <div>
                <h2 id="groupTitle"></h2>
                <p id="groupDescription" class="group-view-description"></p>
            </div>

            <div class="work-actions">
                <button class="btn primary" onclick="workOnFirst()">
                    ▶ Work on First Item
                </button>

                <button class="btn" onclick="workOnRandom()">
                    ⤨ Work on Random Item
                </button>
            </div>

        </div>

        <div class="view-progress">

            <div class="view-progress-info">
                <span id="groupProgressText">0 of 0 completed</span>
                <strong id="groupPercent">0%</strong>
            </div>

            <div class="progress">
                <div id="groupProgress"></div>
            </div>

        </div>

    </section>


    <div class="items-toolbar">
        <div class="items-toolbar-left">
            <h3>Items</h3>
        </div>

        <input
            id="itemSearch"
            class="search"
            type="search"
            placeholder="Search items..."
            oninput="renderItems()"
        >
    </div>


    <form class="add-item" onsubmit="addItem(event)">
        <input
            id="newItemInput"
            class="input"
            placeholder="Add a new item..."
            autocomplete="off"
            required
        >
        <button class="btn primary" type="submit">
            Add Item
        </button>
    </form>


    <div id="itemsList" class="items-list"></div>

</div>

</div><!-- ================= GROUP MODAL ================= --><div id="groupModalBackdrop" class="modal-backdrop hidden"><div class="modal">

    <h3 id="groupModalTitle">New Group</h3>

    <form onsubmit="saveGroup(event)">

        <div class="form-field">
            <label for="groupNameInput">Group name</label>
            <input
                id="groupNameInput"
                class="input"
                required
                maxlength="120"
                placeholder="e.g. Website Launch"
            >
        </div>

        <div class="form-field">
            <label for="groupDescriptionInput">Description (optional)</label>
            <textarea
                id="groupDescriptionInput"
                placeholder="What is this group about?"
            ></textarea>
        </div>

        <div class="modal-actions">
            <button
                type="button"
                class="btn"
                onclick="closeGroupModal()"
            >
                Cancel
            </button>

            <button class="btn primary" type="submit">
                Save Group
            </button>
        </div>

    </form>

</div>

</div><!-- ================= TOASTS ================= --><div id="toastContainer" class="toast-container"></div><script>
/* =========================================================
   DATA
   ========================================================= */

const STORAGE_KEY = "task-groups-app-v1";

let data = {
    groups: []
};

let currentGroupId = null;
let editingGroupId = null;
let draggedItemId = null;


/* =========================================================
   INITIALIZATION
   ========================================================= */

loadData();
renderHome();


/* =========================================================
   STORAGE
   ========================================================= */

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            const parsed = JSON.parse(saved);

            if (
                parsed &&
                Array.isArray(parsed.groups)
            ) {
                data = parsed;
            }
        }
    } catch (error) {
        console.error("Could not load saved data:", error);
    }
}


function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* =========================================================
   UTILITIES
   ========================================================= */

function generateId(prefix = "id") {
    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 9)
    );
}


function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(timestamp) {
    if (!timestamp) return "";

    return new Date(timestamp).toLocaleString(
        undefined,
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}


function getGroup(id) {
    return data.groups.find(group => group.id === id);
}


function getGroupStats(group) {
    const total = group.items.length;

    const done = group.items.filter(
        item => item.done
    ).length;

    const percent = total === 0
        ? 0
        : Math.round((done / total) * 100);

    return {
        total,
        done,
        percent
    };
}


function getGlobalStats() {
    let total = 0;
    let done = 0;

    data.groups.forEach(group => {
        total += group.items.length;

        done += group.items.filter(
            item => item.done
        ).length;
    });

    const percent = total === 0
        ? 0
        : Math.round((done / total) * 100);

    return {
        total,
        done,
        percent
    };
}


/* =========================================================
   HOME
   ========================================================= */

function renderHome() {
    document.getElementById("homeView")
        .classList.remove("hidden");

    document.getElementById("groupView")
        .classList.add("hidden");

    renderGlobalProgress();
    renderGroups();
}


function showHome() {
    currentGroupId = null;
    renderHome();
}


function renderGlobalProgress() {

    const stats = getGlobalStats();

    document.getElementById("globalStats").textContent =
        `${stats.done} of ${stats.total} items completed`;

    document.getElementById("globalPercent").textContent =
        `${stats.percent}%`;

    document.getElementById("globalProgress").style.width =
        `${stats.percent}%`;

    const groupCount = data.groups.length;

    document.getElementById("globalGroupStats").textContent =
        `${groupCount} ${groupCount === 1 ? "group" : "groups"}`;
}


function renderGroups() {

    const container =
        document.getElementById("groupsContainer");

    if (data.groups.length === 0) {

        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <strong>No groups yet</strong>
                Create your first group to start organizing your work.
                <br><br>
                <button class="btn primary" onclick="openGroupModal()">
                    + Create Group
                </button>
            </div>
        `;

        return;
    }


    container.innerHTML = data.groups.map(group => {

        const stats = getGroupStats(group);

        return `
            <article
                class="group-card clickable"
                onclick="openGroup('${group.id}')"
            >

                <div class="group-header">

                    <div class="group-name">
                        ${escapeHtml(group.name)}
                    </div>

                    <div
                        class="group-menu"
                        onclick="event.stopPropagation()"
                    >

                        <button
                            class="icon-btn"
                            title="Edit group"
                            onclick="openGroupModal('${group.id}')"
                        >
                            ✎
                        </button>

                        <button
                            class="icon-btn"
                            title="Delete group"
                            onclick="deleteGroup('${group.id}')"
                        >
                            ×
                        </button>

                    </div>

                </div>


                <div class="group-description">
                    ${escapeHtml(group.description || "No description")}
                </div>


                <div class="group-footer">

                    <div class="group-progress-label">
                        <span>Progress</span>
                        <strong>${stats.percent}%</strong>
                    </div>

                    <div class="progress">
                        <div
                            style="width:${stats.percent}%"
                        ></div>
                    </div>

                    <div class="group-count">
                        ${stats.done} of ${stats.total} items done
                    </div>

                </div>

            </article>
        `;

    }).join("");
}


/* =========================================================
   GROUP CREATION / EDITING
   ========================================================= */

function openGroupModal(groupId = null) {

    editingGroupId = groupId;

    const backdrop =
        document.getElementById("groupModalBackdrop");

    const title =
        document.getElementById("groupModalTitle");

    const nameInput =
        document.getElementById("groupNameInput");

    const descriptionInput =
        document.getElementById("groupDescriptionInput");


    if (groupId) {

        const group = getGroup(groupId);

        if (!group) return;

        title.textContent = "Edit Group";
        nameInput.value = group.name;
        descriptionInput.value =
            group.description || "";

    } else {

        title.textContent = "New Group";
        nameInput.value = "";
        descriptionInput.value = "";

    }

    backdrop.classList.remove("hidden");

    setTimeout(() => {
        nameInput.focus();
    }, 50);
}


function closeGroupModal() {

    document
        .getElementById("groupModalBackdrop")
        .classList.add("hidden");

    editingGroupId = null;
}


function saveGroup(event) {

    event.preventDefault();

    const name =
        document
            .getElementById("groupNameInput")
            .value
            .trim();

    const description =
        document
            .getElementById("groupDescriptionInput")
            .value
            .trim();

    if (!name) return;


    if (editingGroupId) {

        const group =
            getGroup(editingGroupId);

        if (group) {
            group.name = name;
            group.description = description;
        }

        toast("Group updated.");

    } else {

        const group = {
            id: generateId("group"),
            name,
            description,
            createdAt: Date.now(),
            items: []
        };

        data.groups.push(group);

        toast("Group created.");
    }


    saveData();
    closeGroupModal();
    renderHome();
}


function deleteGroup(groupId) {

    const group = getGroup(groupId);

    if (!group) return;


    const stats = getGroupStats(group);

    const message =
        stats.total > 0
            ? `Delete "${group.name}" and its ${stats.total} items?`
            : `Delete "${group.name}"?`;

    if (!confirm(message)) {
        return;
    }


    data.groups =
        data.groups.filter(
            group => group.id !== groupId
        );

    saveData();

    toast("Group deleted.");

    renderHome();
}


/* =========================================================
   OPEN GROUP
   ========================================================= */

function openGroup(groupId) {

    const group = getGroup(groupId);

    if (!group) return;

    currentGroupId = groupId;

    document
        .getElementById("homeView")
        .classList.add("hidden");

    document
        .getElementById("groupView")
        .classList.remove("hidden");

    document
        .getElementById("itemSearch")
        .value = "";

    document
        .getElementById("newItemInput")
        .value = "";

    renderGroupView();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function renderGroupView() {

    const group = getGroup(currentGroupId);

    if (!group) {
        showHome();
        return;
    }


    const stats = getGroupStats(group);


    document.getElementById("groupTitle")
        .textContent = group.name;

    document.getElementById("groupDescription")
        .textContent =
            group.description || "No description";


    document.getElementById("groupProgressText")
        .textContent =
            `${stats.done} of ${stats.total} completed`;

    document.getElementById("groupPercent")
        .textContent =
            `${stats.percent}%`;

    document.getElementById("groupProgress")
        .style.width =
            `${stats.percent}%`;


    renderItems();
}


/* =========================================================
   ITEMS
   ========================================================= */

function addItem(event) {

    event.preventDefault();

    const input =
        document.getElementById("newItemInput");

    const title = input.value.trim();

    if (!title) return;


    const group = getGroup(currentGroupId);

    if (!group) return;


    group.items.push({
        id: generateId("item"),
        title,
        done: false,
        completedAt: null,
        createdAt: Date.now()
    });


    saveData();

    input.value = "";

    renderGroupView();

    input.focus();

    toast("Item added.");
}


function renderItems() {

    const group = getGroup(currentGroupId);

    if (!group) return;


    const list =
        document.getElementById("itemsList");

    const query =
        document
            .getElementById("itemSearch")
            .value
            .trim()
            .toLowerCase();


    let items = group.items;

    if (query) {
        items = items.filter(item =>
            item.title.toLowerCase().includes(query)
        );
    }


    if (items.length === 0) {

        if (query) {

            list.innerHTML = `
                <div class="empty-state">
                    <strong>No matching items</strong>
                    Try a different search.
                </div>
            `;

        } else {

            list.innerHTML = `
                <div class="empty-state">
                    <strong>No items yet</strong>
                    Add your first item above.
                </div>
            `;
        }

        return;
    }


    list.innerHTML = items.map(item => {

        const completedText =
            item.done
                ? `Completed ${formatDate(item.completedAt)}`
                : `Added ${formatDate(item.createdAt)}`;


        return `
            <div
                class="item ${item.done ? "done" : ""}"
                draggable="true"
                data-id="${item.id}"
                ondragstart="dragStart(event)"
                ondragend="dragEnd(event)"
                ondragover="dragOver(event)"
                ondrop="dropItem(event)"
            >

                <div class="drag-handle" title="Drag to reorder">
                    ⋮⋮
                </div>


                <button
                    class="check-btn"
                    title="${item.done ? "Mark as not done" : "Mark as done"}"
                    onclick="toggleItem('${item.id}')"
                >
                    ✓
                </button>


                <div class="item-content">

                    <div class="item-title">
                        ${escapeHtml(item.title)}
                    </div>

                    <div class="item-meta">
                        ${completedText}
                    </div>

                </div>


                <div class="item-actions">

                    <button
                        class="icon-btn"
                        title="Edit item"
                        onclick="editItem('${item.id}')"
                    >
                        ✎
                    </button>

                    <button
                        class="icon-btn"
                        title="Delete item"
                        onclick="deleteItem('${item.id}')"
                    >
                        ×
                    </button>

                </div>

            </div>
        `;

    }).join("");
}


/* =========================================================
   COMPLETE / UNCOMPLETE
   ========================================================= */

function toggleItem(itemId) {

    const group = getGroup(currentGroupId);

    if (!group) return;


    const item =
        group.items.find(
            item => item.id === itemId
        );

    if (!item) return;


    item.done = !item.done;

    item.completedAt =
        item.done
            ? Date.now()
            : null;


    saveData();

    renderGroupView();

    toast(
        item.done
            ? "Item marked as done."
            : "Item marked as not done."
    );
}


/* =========================================================
   EDIT ITEM
   ========================================================= */

function editItem(itemId) {

    const group = getGroup(currentGroupId);

    if (!group) return;


    const item =
        group.items.find(
            item => item.id === itemId
        );

    if (!item) return;


    const newTitle =
        prompt("Edit item:", item.title);

    if (newTitle === null) {
        return;
    }


    const trimmed = newTitle.trim();

    if (!trimmed) {
        toast("Item cannot be empty.");
        return;
    }


    item.title = trimmed;

    saveData();

    renderItems();

    toast("Item updated.");
}


/* =========================================================
   DELETE ITEM
   ========================================================= */

function deleteItem(itemId) {

    const group = getGroup(currentGroupId);

    if (!group) return;


    const item =
        group.items.find(
            item => item.id === itemId
        );

    if (!item) return;


    if (!confirm(`Delete "${item.title}"?`)) {
        return;
    }


    group.items =
        group.items.filter(
            item => item.id !== itemId
        );


    saveData();

    renderGroupView();

    toast("Item deleted.");
}


/* =========================================================
   WORK ON FIRST
   ========================================================= */

function workOnFirst() {

    const group = getGroup(currentGroupId);

    if (!group || group.items.length === 0) {

        toast("This group has no items.");

        return;
    }


    /*
        "First item" means the first item in the
        current ordering, regardless of completion.
    */

    focusItem(group.items[0].id);
}


/* =========================================================
   WORK ON RANDOM
   ========================================================= */

function workOnRandom() {

    const group = getGroup(currentGroupId);

    if (!group || group.items.length === 0) {

        toast("This group has no items.");

        return;
    }


    /*
        Prefer unfinished items.
        If everything is completed, pick randomly
        from all items.
    */

    let candidates =
        group.items.filter(
            item => !item.done
        );

    if (candidates.length === 0) {
        candidates = group.items;
    }


    const randomIndex =
        Math.floor(
            Math.random() * candidates.length
        );

    const selected =
        candidates[randomIndex];


    focusItem(selected.id);
}


/* =========================================================
   FOCUS ITEM
   ========================================================= */

function focusItem(itemId) {

    renderItems();

    setTimeout(() => {

        const element =
            document.querySelector(
                `.item[data-id="${itemId}"]`
            );

        if (!element) return;

        element.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        element.classList.add("focused");

        setTimeout(() => {
            element.classList.remove("focused");
        }, 1300);

    }, 30);
}


/* =========================================================
   DRAG AND DROP REORDERING
   ========================================================= */

function dragStart(event) {

    draggedItemId =
        event.currentTarget.dataset.id;

    event.currentTarget.classList.add("dragging");

    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData(
        "text/plain",
        draggedItemId
    );
}


function dragEnd(event) {

    event.currentTarget.classList.remove(
        "dragging"
    );

    document
        .querySelectorAll(".drag-over")
        .forEach(element => {
            element.classList.remove("drag-over");
        });

    draggedItemId = null;
}


function dragOver(event) {

    event.preventDefault();

    const target =
        event.currentTarget;

    if (
        !draggedItemId ||
        target.dataset.id === draggedItemId
    ) {
        return;
    }

    target.classList.add("drag-over");

    event.dataTransfer.dropEffect = "move";
}


function dropItem(event) {

    event.preventDefault();

    const target =
        event.currentTarget;

    target.classList.remove("drag-over");


    const targetId =
        target.dataset.id;


    if (
        !draggedItemId ||
        draggedItemId === targetId
    ) {
        return;
    }


    const group = getGroup(currentGroupId);

    if (!group) return;


    const fromIndex =
        group.items.findIndex(
            item => item.id === draggedItemId
        );

    const toIndex =
        group.items.findIndex(
            item => item.id === targetId
        );


    if (
        fromIndex === -1 ||
        toIndex === -1
    ) {
        return;
    }


    const [moved] =
        group.items.splice(fromIndex, 1);

    group.items.splice(toIndex, 0, moved);


    saveData();

    renderItems();

    draggedItemId = null;
}


/* =========================================================
   EXPORT
   ========================================================= */

function exportData() {

    const json =
        JSON.stringify(data, null, 2);

    const blob =
        new Blob(
            [json],
            { type: "application/json" }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        `task-groups-backup-${new Date()
            .toISOString()
            .slice(0, 10)}.json`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    toast("Backup exported.");
}


/* =========================================================
   IMPORT
   ========================================================= */

function importData(event) {

    const file =
        event.target.files[0];

    if (!file) return;


    const reader =
        new FileReader();


    reader.onload = function() {

        try {

            const imported =
                JSON.parse(reader.result);


            if (
                !imported ||
                !Array.isArray(imported.groups)
            ) {
                throw new Error(
                    "Invalid file format."
                );
            }


            if (
                !confirm(
                    "Import this backup? Your current data will be replaced."
                )
            ) {
                return;
            }


            data = imported;

            saveData();

            showHome();

            toast("Backup imported successfully.");

        } catch (error) {

            console.error(error);

            alert(
                "Could not import this file. " +
                "Please select a valid Task Groups JSON backup."
            );
        }

    };


    reader.readAsText(file);

    event.target.value = "";
}


/* =========================================================
   TOAST
   ========================================================= */

function toast(message) {

    const container =
        document.getElementById("toastContainer");

    const element =
        document.createElement("div");

    element.className = "toast";

    element.textContent = message;

    container.appendChild(element);


    setTimeout(() => {

        element.style.opacity = "0";
        element.style.transform = "translateY(5px)";

        setTimeout(() => {
            element.remove();
        }, 200);

    }, 2200);
}


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener("keydown", event => {

    /*
        Escape closes the group modal.
    */

    if (event.key === "Escape") {

        const modal =
            document.getElementById(
                "groupModalBackdrop"
            );

        if (!modal.classList.contains("hidden")) {
            closeGroupModal();
        }
    }


    /*
        Enter while on the group page and not inside
        an input: work on the first item.
    */

    if (
        event.key === "Enter" &&
        currentGroupId &&
        document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "TEXTAREA" &&
        document.activeElement.tagName !== "BUTTON"
    ) {
        workOnFirst();
    }

});


/* =========================================================
   CLICK OUTSIDE MODAL
   ========================================================= */

document
    .getElementById("groupModalBackdrop")
    .addEventListener("click", event => {

        if (
            event.target.id ===
            "groupModalBackdrop"
        ) {
            closeGroupModal();
        }

    });
